name: Daily refresh
on:
  schedule:
    - cron: "30 1 * * *"   # 7:00 am India time: full scan with the App Store search step
    - cron: "30 7 * * *"   # 1:00 pm India time
    - cron: "30 15 * * *"  # 9:00 pm India time
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency: refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Prepare visitor suggestions
        run: |
          python3 - <<'PY'
          import json, re, subprocess, urllib.parse, os
          subs = json.load(open('submissions.json')) if os.path.exists('submissions.json') else []
          out = []
          for x in subs[-200:]:
              m = re.search(r'/id(\d{5,})', x.get('link', ''))
              if m: out.append({'id': m.group(1), 'date': x['date']}); continue
              r = subprocess.run(['curl', '-s', '-m', '30', 'https://itunes.apple.com/search?country=in&entity=software&limit=3&term=' + urllib.parse.quote(x['app'])], capture_output=True, text=True).stdout
              try:
                  res = json.loads(r)['results']
                  want = re.sub(r'[^a-z0-9]', '', x['app'].lower())
                  for a in res:
                      have = re.sub(r'[^a-z0-9]', '', a['trackName'].lower())
                      if want and (have.startswith(want) or want.startswith(have[:max(5, len(want))])):
                          out.append({'id': str(a['trackId']), 'date': x['date']}); break
              except Exception:
                  pass
          json.dump(out, open('submitted.json', 'w'))
          print('visitor suggestions resolved:', len(out), 'of', len(subs))
          PY
      - name: Collect approved community reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, re, subprocess, urllib.parse, os
          out = subprocess.run(['gh', 'issue', 'list', '--label', 'approved', '--state', 'open', '--limit', '30', '--json', 'number,body,createdAt,url'], capture_output=True, text=True).stdout
          add, nums = [], []
          for it in json.loads(out or '[]'):
              body = it.get('body') or ''
              fields = dict(re.findall(r'### ([^\n]+)\n\n(.*?)(?=\n\n### |\Z)', body, re.S))
              link = fields.get('App Store link', '')
              m = re.search(r'/id(\d{5,})', link)
              if not m:
                  name = fields.get('App name', '').strip()
                  if name:
                      r = subprocess.run(['curl', '-s', '-m', '30', 'https://itunes.apple.com/search?country=in&entity=software&limit=3&term=' + urllib.parse.quote(name)], capture_output=True, text=True).stdout
                      try:
                          res = json.loads(r)['results']
                          if res and name.lower()[:6] in res[0]['trackName'].lower(): m = re.match(r'(\d+)', str(res[0]['trackId']))
                      except Exception:
                          pass
              if not m:
                  continue
              add.append({'id': m.group(1), 'date': it['createdAt'][:10], 'source': 'Community report', 'text': 'Reported by a visitor on ' + it['createdAt'][:10] + ' and reviewed by the site owner', 'url': it['url']})
              nums.append(it['number'])
          # entries added by hand by the site owner (apps seen or tested on an iPhone Duo)
          if os.path.exists('reported_manual.json'):
              try: add.extend(json.load(open('reported_manual.json')))
              except ValueError: pass
          json.dump(add, open('reported_add.json', 'w')); open('approved_numbers.txt', 'w').write(' '.join(str(n) for n in nums))
          print('approved community reports:', len(add))
          PY
      - name: Scan the App Store
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # the 1 pm and 9 pm runs skip the slow App Store search step; the 7 am run and manual runs do it
          SKIP=""
          if [ "$SCHEDULE" = "30 7 * * *" ] || [ "$SCHEDULE" = "30 15 * * *" ]; then SKIP="--skip-discover"; fi
          for i in $(seq 1 12); do
            out=$(python3 duo_cloud.py data.json data.new.json --site --slice 1500 --hist-minutes 30 --reported reported_add.json --submitted submitted.json $SKIP)
            echo "$out" | cut -c1-2000
            case "$out" in
              DONE*) break ;;
              CONTINUE*) ;;
              *) echo "Scan stopped; the site is left unchanged."; exit 1 ;;
            esac
          done
          test -s data.new.json
          python3 -c "import json; a=json.load(open('data.json')); b=json.load(open('data.new.json')); assert len(b['rows']) >= len(a['rows']), 'fewer apps than before'"
          mv data.new.json data.json
      - name: Publish the new list
        run: |
          git config user.name "refresh-bot"
          git config user.email "refresh-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Daily refresh"
          git pull --rebase
          git push
      - name: Close approved community reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(cat approved_numbers.txt 2>/dev/null); do
            gh issue comment "$n" --body "Thank you. This app was added to the tracker in today's refresh." || true
            gh issue close "$n" || true
          done
      - name: Email the owner about watched apps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, subprocess
          w = json.load(open('watch.json'))
          rows = {str(r['id']): r for r in json.load(open('data.json'))['rows']}
          hit = [x for x in w.get('watch', []) if str(x['id']) in rows and str(x['id']) not in w.get('notified', [])]
          for x in hit:
              r = rows[str(x['id'])]
              how = ('Reported by ' + r.get('report_by', 'the press')) if r.get('source') == 'reported' else ('Confirmed in its update notes, version ' + str(r.get('duo_version', '')))
              body = f"{r['app']} is now on the tracker.\n\n- Duo support date: {r['duo_date']}\n- {how}\n- App Store: {r.get('url', '')}\n- Tracker: https://duoapptracker.github.io/\n\nYou asked to be told when this app was optimised for iPhone Duo. Close this issue once read."
              subprocess.run(['gh', 'issue', 'create', '--title', f"Now optimised for iPhone Duo: {r['app']}", '--body', body], check=True)
              w.setdefault('notified', []).append(str(x['id']))
          if hit:
              json.dump(w, open('watch.json', 'w'), indent=2); open('watch.json', 'a').write('\n')
          print('watched apps newly optimised:', [x['name'] for x in hit])
          PY
          git add watch.json
          git diff --cached --quiet || { git commit -m "Watched app notified"; git pull --rebase; git push; }
