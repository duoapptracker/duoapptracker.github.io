name: Daily refresh
on:
  schedule:
    # GitHub drops or delays scheduled runs, so ask every hour; the "gate" step below starts a real scan
    # only when the list is more than 5 hours old; an outside timer (cron-job.org) also starts it at fixed times
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "manual = scan now; backlog = next batch of sweep finds; timer = outside timer, scan only if the list is old enough"
        required: false
        default: manual
permissions:
  contents: write
  issues: write
  actions: write
concurrency: refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2, pinned
        with:
          ref: main
      - name: Decide whether it is time to scan
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          REASON: ${{ github.event.inputs.reason }}
        run: |
          python3 - <<'PY'
          import json, os, datetime
          d = json.load(open('data.json'))
          u = datetime.datetime.strptime(d['updated'], '%Y-%m-%dT%H:%MZ')
          now = datetime.datetime.utcnow()
          age = (now - u).total_seconds() / 3600
          ist = lambda t: (t + datetime.timedelta(hours=5, minutes=30)).date()
          manual = os.environ['EVENT'] == 'workflow_dispatch' and os.environ.get('REASON', 'manual') != 'timer'
          go = manual or age >= 5   # 5 h: whenever GitHub or the outside timer fires, a scan almost always starts
          # the first scan of each India day (or a manual one) also searches outside the charts; back-to-back backlog scans skip it
          discover = os.environ.get('REASON', 'manual') == 'manual' and os.environ['EVENT'] == 'workflow_dispatch' or ist(u) < ist(now)
          print('list age (hours): %.1f | manual: %s | scan: %s | discover: %s' % (age, manual, go, discover))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('run=%s\ndiscover=%s\n' % (str(go).lower(), str(discover).lower()))
          PY
      - name: Start the daily App Store sweep if it is due
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list --workflow sweep.yml --limit 1 --json createdAt --jq '.[0].createdAt // ""')
          python3 - "$last" <<'PY' && gh workflow run sweep.yml --ref main || true
          import sys, datetime
          last = sys.argv[1]
          if last:
              age = (datetime.datetime.utcnow() - datetime.datetime.strptime(last, '%Y-%m-%dT%H:%M:%SZ')).total_seconds() / 3600
              print('last sweep started %.1f hours ago' % age); sys.exit(0 if age >= 22 else 1)
          print('no sweep yet')
          PY
      - name: Prepare visitor suggestions
        if: steps.gate.outputs.run == 'true'
        run: |
          python3 - <<'PY'
          import json, re, subprocess, urllib.parse, os
          subs = json.load(open('submissions.json')) if os.path.exists('submissions.json') else []
          out = []
          for x in subs[-4000:]:
              m = re.search(r'/id(\d{5,})', x.get('link', ''))
              c = re.search(r'apps\.apple\.com/(\w\w)/app/', x.get('link', ''))
              if m: out.append({'id': m.group(1), 'date': x['date'], 'cc': c.group(1) if c else ''}); continue
              r = subprocess.run(['curl', '-s', '-m', '30', 'https://itunes.apple.com/search?country=in&entity=software&limit=3&term=' + urllib.parse.quote(x['app'])], capture_output=True, text=True).stdout
              try:
                  res = json.loads(r)['results']
                  want = re.sub(r'[^a-z0-9]', '', x['app'].lower())
                  for a in res:
                      have = re.sub(r'[^a-z0-9]', '', a['trackName'].lower())
                      if want and (have.startswith(want) or want.startswith(have[:max(5, len(want))])):
                          out.append({'id': str(a['trackId']), 'date': x['date']}); break
              except Exception:
                  pass
          # the next batch of sweep finds that have not been checked yet (until the backlog is empty)
          try:
              found = json.load(open('sweep_found.json'))
              site = json.load(open('data.json'))
              done = {str(r['id']) for r in site['rows']} | set(site.get('submitted', {})) | {x['id'] for x in out}
              today = __import__('datetime').date.today().isoformat()
              order = sorted(found.items(), key=lambda kv: (kv[1].get('how') != 'description', kv[1].get('found', '')))
              batch = [{'id': i, 'date': today, 'cc': f.get('cc', '')} for i, f in order if i not in done][:1500]
              out += batch
              print('sweep finds added to this scan:', len(batch))
          except (OSError, ValueError) as e:
              print('no sweep finds:', e)
          json.dump(out, open('submitted.json', 'w'))
          print('visitor suggestions resolved:', len(out), 'of', len(subs))
          PY
      - name: Collect approved community reports
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, re, subprocess, urllib.parse, os
          out = subprocess.run(['gh', 'issue', 'list', '--label', 'approved', '--state', 'open', '--limit', '30', '--json', 'number,body,createdAt,url'], capture_output=True, text=True).stdout
          add, nums = [], []
          OWNERS = {'Raaj52', 'duoapptracker'}
          for it in json.loads(out or '[]'):
              # guard: count it only if the owner added the 'approved' label and nobody edited the report afterwards
              ev = subprocess.run(['gh', 'api', 'repos/${{ github.repository }}/issues/%d/events' % it['number']], capture_output=True, text=True).stdout
              try: ev = json.loads(ev or '[]')
              except ValueError: ev = []
              lab = [e for e in ev if e.get('event') == 'labeled' and (e.get('label') or {}).get('name') == 'approved']
              if not lab or (lab[-1].get('actor') or {}).get('login') not in OWNERS: continue
              q = 'query{repository(owner:"%s",name:"%s"){issue(number:%d){lastEditedAt}}}' % (*'${{ github.repository }}'.split('/'), it['number'])
              ed = subprocess.run(['gh', 'api', 'graphql', '-f', 'query=' + q, '--jq', '.data.repository.issue.lastEditedAt'], capture_output=True, text=True).stdout.strip()
              if ed and ed != 'null' and ed > lab[-1]['created_at']: continue
              body = it.get('body') or ''
              fields = dict(re.findall(r'### ([^\n]+)\n\n(.*?)(?=\n\n### |\Z)', body, re.S))
              link = fields.get('App Store link', '')
              m = re.search(r'/id(\d{5,})', link)
              if not m:
                  name = fields.get('App name', '').strip()
                  if name:
                      r = subprocess.run(['curl', '-s', '-m', '30', 'https://itunes.apple.com/search?country=in&entity=software&limit=3&term=' + urllib.parse.quote(name)], capture_output=True, text=True).stdout
                      try:
                          res = json.loads(r)['results']
                          if res and name.lower()[:6] in res[0]['trackName'].lower(): m = re.match(r'(\d+)', str(res[0]['trackId']))
                      except Exception:
                          pass
              if not m:
                  continue
              add.append({'id': m.group(1), 'date': it['createdAt'][:10], 'source': 'Community report', 'text': 'Reported by a visitor on ' + it['createdAt'][:10] + ' and reviewed by the site owner', 'url': it['url']})
              nums.append(it['number'])
          # entries added by hand by the site owner (apps seen or tested on an iPhone Duo)
          if os.path.exists('reported_manual.json'):
              try: add.extend(json.load(open('reported_manual.json')))
              except ValueError: pass
          json.dump(add, open('reported_add.json', 'w')); open('approved_numbers.txt', 'w').write(' '.join(str(n) for n in nums))
          print('approved community reports:', len(add))
          PY
      - name: Scan the App Store
        if: steps.gate.outputs.run == 'true'
        env:
          DISCOVER: ${{ steps.gate.outputs.discover }}
        run: |
          # only the first scan of each India day does the slow App Store search step
          SKIP=""
          if [ "$DISCOVER" != "true" ]; then SKIP="--skip-discover"; fi
          for i in $(seq 1 12); do
            out=$(python3 duo_cloud.py data.json data.new.json --site --slice 1500 --hist-minutes 30 --reported reported_add.json --submitted submitted.json $SKIP)
            echo "$out" | cut -c1-2000
            case "$out" in
              DONE*) break ;;
              CONTINUE*) ;;
              *) echo "Scan stopped; the site is left unchanged."; exit 1 ;;
            esac
          done
          test -s data.new.json
          python3 -c "import json; a=json.load(open('data.json')); b=json.load(open('data.new.json')); assert len(b['rows']) >= len(a['rows']), 'fewer apps than before'"
          mv data.new.json data.json
      - name: Publish the new list
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "refresh-bot"
          git config user.email "refresh-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Daily refresh"
          git pull --rebase
          git push
      - name: Close approved community reports
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(cat approved_numbers.txt 2>/dev/null); do
            gh issue comment "$n" --body "Thank you. This app was added to the tracker in today's refresh." || true
            gh issue close "$n" || true
          done
      - name: Email the owner about watched apps
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, subprocess
          w = json.load(open('watch.json'))
          rows = {str(r['id']): r for r in json.load(open('data.json'))['rows']}
          hit = [x for x in w.get('watch', []) if str(x['id']) in rows and str(x['id']) not in w.get('notified', [])]
          for x in hit:
              r = rows[str(x['id'])]
              how = ('Reported by ' + r.get('report_by', 'the press')) if r.get('source') == 'reported' else ('Confirmed in its update notes, version ' + str(r.get('duo_version', '')))
              body = f"{r['app']} is now on the tracker.\n\n- Duo support date: {r['duo_date']}\n- {how}\n- App Store: {r.get('url', '')}\n- Tracker: https://duoapptracker.github.io/\n\nYou asked to be told when this app was optimised for iPhone Duo. Close this issue once read."
              subprocess.run(['gh', 'issue', 'create', '--title', f"Now optimised for iPhone Duo: {r['app']}", '--body', body], check=True)
              w.setdefault('notified', []).append(str(x['id']))
          if hit:
              json.dump(w, open('watch.json', 'w'), indent=2); open('watch.json', 'a').write('\n')
          print('watched apps newly optimised:', [x['name'] for x in hit])
          PY
          git add watch.json
          git diff --cached --quiet || { git commit -m "Watched app notified"; git pull --rebase; git push; }
      - name: Keep going while sweep finds are waiting
        # runs on every check (even skipped ones), so a chain broken by a timer run is picked up again
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          left=$(python3 - <<'PY'
          import json
          try:
              found = json.load(open('sweep_found.json')); site = json.load(open('data.json'))
              done = {str(r['id']) for r in site['rows']} | set(site.get('submitted', {}))
              print(sum(1 for i in found if i not in done))
          except (OSError, ValueError):
              print(0)
          PY
          )
          echo "sweep finds still waiting: $left"
          if [ "$left" -gt 0 ]; then gh workflow run refresh.yml --ref main -f reason=backlog; fi
      - name: Email the owner that a scan finished
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, subprocess, datetime
          new = json.load(open('data.json'))
          shas = subprocess.run(['git', 'log', '--format=%H', '-n', '2', '--', 'data.json'], capture_output=True, text=True).stdout.split()
          old_ids = set()
          if len(shas) == 2:
              old = json.loads(subprocess.run(['git', 'show', shas[1] + ':data.json'], capture_output=True, text=True).stdout)
              old_ids = {str(r['id']) for r in old['rows']}
          rows = new['rows']
          added = [r for r in rows if str(r['id']) not in old_ids] if old_ids else []
          reported = sum(1 for r in rows if r.get('source') == 'reported')
          ist = (datetime.datetime.utcnow() + datetime.timedelta(hours=5, minutes=30)).strftime('%d %b, %I:%M %p IST')
          title = 'Scan finished: %d apps (%d new)' % (len(rows), len(added))
          names = ', '.join(r['app'] for r in added[:8]) + (' and %d more' % (len(added) - 8) if len(added) > 8 else '')
          body = '\n'.join(['The tracker scan finished at ' + ist + '.', '',
                            '- Apps on the site: %d' % len(rows),
                            '- New since the last scan: %d' % len(added),
                            '- Reported only (no Duo mention in notes): %d' % reported,
                            ('- New apps: ' + names) if added else '- No new apps this time',
                            '', 'https://duoapptracker.github.io/'])
          out = subprocess.run(['gh', 'issue', 'create', '--title', title, '--body', body], capture_output=True, text=True)
          print(out.stdout.strip() or out.stderr.strip())
          url = out.stdout.strip().split()[-1] if out.stdout.strip() else ''
          if url: subprocess.run(['gh', 'issue', 'close', url], check=False)
          PY
